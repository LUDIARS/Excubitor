# Excubitor runtime policy. This file is not a service catalog.
# Service definitions belong only in each owning repository's excubitor.catalog.yaml.

global:
  env:
    # Shared non-secret environment injected into services started by Excubitor.
    LUDIARS_ALLOWED_HOSTS: "${DOMAIN_ROOT}"

project_versions:
  # Excubitor's own displayed build version. Other services report their package/git version.
  excubitor:
    major: 1
    minor: 4

memory_monitor:
  enabled: true
  interval_sec: 60
  retention_hours: 48
  default_service_rss_budget_mb: 1024
  default_service_cpu_budget_pct: 80
  wsl:
    enabled: true
    distros: []
    leak_window_min: 120
    leak_threshold_mb_per_hr: 200

monitor:
  # 死活確認 (HTTP / TCP / プロセス / port の probe)。 子プロセスをほぼ起動しないので短周期で回す。
  health_interval_sec: 60
  # git / 版 / docker の棚卸し。 git は .git 直読み + checkout ごとに git status 1 回。
  inventory_interval_sec: 300
  # 同時に投げる probe の上限 (全サービス同時で負荷の山を作らない)。
  probe_concurrency: 8
  # 状態が変わらなくても死活履歴へ 1 行残す間隔。 稼働率集計の粒度。
  liveness_heartbeat_sec: 300

federation:
  # 他拠点の health (相手がキャッシュしている値) を取りに行く周期。
  peer_poll_sec: 60
  peer_timeout_ms: 5000
  # これより古いピアの値は stale と表示する。
  stale_after_sec: 180

netwatch:
  # 通信監視 (spec/feature/network-watch.md)。 ここは全拠点共有の方針だけ。 キャプチャは env
  # EXCUBITOR_NETWATCH_INTERFACE (tshark -D の名前) を設定した拠点だけが動かす。 tshark の場所は
  # EXCUBITOR_NETWATCH_TSHARK (未設定なら PATH 上の tshark)。
  enabled: true
  # これ以外の国を国外としてマークする (ISO 3166-1 alpha-2)。
  home_country: JP
  # tshark -N。 g = Wireshark の MaxMind GeoIP (Wireshark 側で mmdb のディレクトリを登録する)。 n / N は不可。
  name_resolution: g
  restart_after_min: 60
  overlay:
    # Tela のデスクトップオーバーレイが読む一覧 (TELA_LIST_VIEW 1)。
    file: data/netwatch/overlay.telalist
    max_rows: 12
    include: public
    interval_sec: 2
  detect:
    # 送信元プロセスを特定し、 Excubitor のサービス (とその子孫) の通信を一覧から外す。
    # 接続表 (netstat -ano) を読む周期 (秒)。 0 で特定しない。 Windows のみ。
    owner_poll_sec: 2
    # サービス以外の通信で、 これ以外の宛先ポートは「許可外ポート」として怪しいとする。
    allowed_ports: [53, 80, 443, 853]
    # 怪しいとしないドメイン (配下を含む)。 例: [github.com, anthropic.com]
    trusted_domains: []
  block:
    # 遮断 (Windows ファイアウォール)。 人が POST /api/v1/netwatch/blocks で登録したものだけを止める。
    # 反映は管理者権限の同期タスク (scripts/install-netwatch-firewall.ps1 を管理者で 1 回実行して導入)。
    # 同期タスクを入れていない拠点では登録しても止まらない (GET の sync.state が missing)。
    enabled: true
    file: data/netwatch/firewall-blocks.json
    default_ttl_min: 60
    max_ttl_min: 10080
    # 既定で守る範囲 (loopback・LAN・Tailscale 100.64/10・link-local) に足す範囲。 例: DNS サーバ
    protected_addresses: []
    # 既定で守るプログラム (svchost.exe・lsass.exe・tailscale 系など) に足す実行ファイル名。
    protected_programs: []

retention:
  enabled: true
  logs_hours: 72
  liveness_hours: 168
  parquet_days: 90
  interval_min: 60
  batch_rows: 50000

log_store:
  ring_lines_per_service: 2000
  ring_lines_global: 20000
  compact_hour_utc: 18

package_audit:
  # npm ls -g --depth=0 の実測一覧を正本とし、ここでは npm 外インストーラや
  # 必須 CLI の package/version 対応だけを宣言する。
  include_unlisted_npm_globals: true

  release_notes:
    enabled: true
    # GitHub API の未認証 rate limit を食い尽くさない上限。GITHUB_TOKEN があれば認証利用する。
    max_packages: 40

  global_cli:
    - id: codex-security
      command: codex-security
      npm_package: "@openai/codex-security"
      version_args: ["--version"]
      required: true

    - id: codex
      command: codex
      npm_package: "@openai/codex"
      version_args: ["--version"]
      required: true

    - id: claude
      command: claude
      npm_package: "@anthropic-ai/claude-code"
      version_args: ["--version"]
      required: true

    - id: anatomia
      command: anatomia
      workspace_package: "${ARS_ROOT}/Anatomia/package.json"
      version_args: ["--version"]
      required: true

ergo_watch:
  # Ergo のパッケージ更新監視 (spec/feature/ergo-watch-delivery.md)。対象は catalog で
  # ergo_watch: true を付けたサービスの checkout。webhook はここに置かない (暗号化 config だけ)。
  # ergo_pkg は PATH 上のもの。別の場所なら "${ARS_ROOT}/..." で書く。
  ergo_pkg: ergo_pkg
  # 配送先。concordia (既定) は Concordia の /v1/events/package-updates 経由でデプロイ通知チャンネルへ、
  # discord は暗号化 config の webhook へ直送。
  delivery: concordia
  # Revisor / Concordia の URL は catalog のこのサービスの port から loopback で作る。
  revisor_service: revisor
  concordia_service: concordia
  # 日次要約を送る時 (ローカル時刻)。
  summary_hour: 9
